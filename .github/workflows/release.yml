name: Build Windows release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read version and validate release tag
        shell: pwsh
        run: |
          $version = ([xml](Get-Content QuietIsland.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match Version in QuietIsland.csproj' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer and portable archives
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - name: Run unit tests
        shell: pwsh
        run: dotnet test Tests/QuietIsland.Tests.csproj -c Release --logger "console;verbosity=minimal"
      - uses: actions/upload-artifact@v4
        with:
          name: QuietIsland-windows-x64
          path: |
            artifacts/QuietIsland-Setup-*-win-x64.exe
            artifacts/QuietIsland-*-win-x64-portable.zip
            artifacts/QuietIsland-*-win-x64-light.zip
            artifacts/QuietIsland-*-SHA256SUMS.txt
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Existing release preserved.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "QuietIsland $env:APP_VERSION" --generate-notes "artifacts/QuietIsland-Setup-$env:APP_VERSION-win-x64.exe" "artifacts/QuietIsland-$env:APP_VERSION-win-x64-portable.zip" "artifacts/QuietIsland-$env:APP_VERSION-win-x64-light.zip" "artifacts/QuietIsland-$env:APP_VERSION-SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
